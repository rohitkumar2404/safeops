<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SafeOps — Web Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0d0f14;--bg2:#13161e;--bg3:#1a1d27;
--panel:#161921;--card:#1e2230;--card2:#252a3a;
--border:#2a2f42;--border2:#363c54;
--text:#e8ecf5;--text2:#8b93b0;--text3:#555e7a;
--accent:#00d4aa;--accent2:#0099ff;--accent3:#ff6b35;
--warn:#f5a623;--danger:#ff4757;--success:#00d4aa;
--purple:#8b5cf6;
--font-head:'Syne',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'DM Mono',monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);display:flex;height:100vh}

#sidebar{width:220px;min-width:220px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-logo{padding:20px 16px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-logo-mark{width:32px;height:32px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo-mark i{color:#0d0f14;font-size:18px}
.sb-logo-text{font-family:var(--font-head);font-weight:700;font-size:15px;letter-spacing:0.02em;color:var(--text)}
.sb-logo-text span{color:var(--accent)}
.sb-section{padding:12px 8px 4px;font-size:10px;font-family:var(--font-mono);color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;font-weight:500}
.sb-nav{flex:1;overflow-y:auto;padding-bottom:8px}
.sb-nav::-webkit-scrollbar{width:3px}
.sb-nav::-webkit-scrollbar-thumb{background:var(--border)}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 14px;margin:1px 6px;border-radius:7px;cursor:pointer;transition:all 0.15s;font-size:13px;color:var(--text2);font-weight:400;position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(0,212,170,0.1);color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-item i{font-size:16px;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:10px;font-family:var(--font-mono);background:var(--accent3);color:white;padding:1px 6px;border-radius:10px;font-weight:500}
.nav-badge.warn{background:var(--warn)}
.nav-badge.blue{background:var(--accent2)}
.sb-bottom{padding:10px 8px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background 0.15s}
.sb-user:hover{background:var(--bg3)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#0d0f14;flex-shrink:0;font-family:var(--font-head)}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:10px;color:var(--text3);font-family:var(--font-mono)}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;min-height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px}
.page-title{font-family:var(--font-head);font-size:16px;font-weight:600;color:var(--text)}
.topbar-search{flex:1;max-width:320px;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 12px;margin-left:16px}
.topbar-search i{color:var(--text3);font-size:15px}
.topbar-search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:var(--font-body)}
.topbar-search input::placeholder{color:var(--text3)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:7px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;color:var(--text2)}
.icon-btn:hover{background:var(--card);color:var(--text);border-color:var(--border2)}
.icon-btn.notif{position:relative}
.notif-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;background:var(--accent3);border-radius:50%;border:1.5px solid var(--panel)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.15s;font-family:var(--font-body);border:none}
.btn-primary{background:var(--accent);color:#0d0f14}
.btn-primary:hover{background:#00bfa0}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--card);color:var(--text)}

.page-content{flex:1;overflow-y:auto;padding:20px}
.page-content::-webkit-scrollbar{width:4px}
.page-content::-webkit-scrollbar-thumb{background:var(--border)}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-family:var(--font-head);font-size:13px;font-weight:600;color:var(--text);letter-spacing:0.02em}
.card-subtitle{font-size:11px;color:var(--text3);margin-top:2px;font-family:var(--font-mono)}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative;overflow:hidden;cursor:pointer;transition:border-color 0.2s}
.kpi:hover{border-color:var(--border2)}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:2px}
.kpi-label{font-size:11px;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
.kpi-value{font-family:var(--font-head);font-size:28px;font-weight:700;color:var(--text);line-height:1}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:6px;display:flex;align-items:center;gap:4px}
.kpi-up{color:var(--success)}
.kpi-down{color:var(--danger)}
.kpi-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:36px;color:var(--text3);opacity:0.18}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:2fr 1fr;gap:12px}

.bar-chart{display:flex;align-items:flex-end;gap:6px;height:100px;margin:8px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:4px}
.bar-label{font-size:9px;color:var(--text3);font-family:var(--font-mono)}

.activity-list{display:flex;flex-direction:column;gap:0}
.activity-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.activity-item:last-child{border-bottom:none}
.activity-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-info{flex:1;min-width:0}
.act-title{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-meta{font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-top:1px}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-family:var(--font-mono);font-weight:500}
.badge-success{background:rgba(0,212,170,0.12);color:var(--accent)}
.badge-warn{background:rgba(245,166,35,0.12);color:var(--warn)}
.badge-danger{background:rgba(255,71,87,0.12);color:var(--danger)}
.badge-info{background:rgba(0,153,255,0.12);color:var(--accent2)}
.badge-purple{background:rgba(139,92,246,0.12);color:var(--purple)}
.badge-neutral{background:var(--bg3);color:var(--text2)}

.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{text-align:left;padding:8px 12px;color:var(--text3);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;border-bottom:1px solid var(--border);font-weight:500}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(255,255,255,0.02);color:var(--text)}
.data-table .td-primary{color:var(--text);font-weight:500}

.form-group{margin-bottom:14px}
.form-label{font-size:11px;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;transition:border-color 0.15s}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--text3)}
.form-select{appearance:none;cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.progress-bar{height:5px;background:var(--bg3);border-radius:10px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:10px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:9px 16px;font-size:12px;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s;font-family:var(--font-mono);letter-spacing:0.04em}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:12px;color:var(--text2)}
.stat-val{font-size:12px;font-family:var(--font-mono);color:var(--text);font-weight:500}

.section-title{font-family:var(--font-head);font-size:14px;font-weight:600;color:var(--text)}

.toggle{width:36px;height:20px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle::after{content:'';position:absolute;width:14px;height:14px;background:white;border-radius:50%;top:2px;left:2px;transition:left 0.2s}
.toggle.on::after{left:18px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);cursor:pointer;transition:all 0.15s;font-family:var(--font-mono)}
.chip:hover,.chip.selected{background:rgba(0,212,170,0.1);color:var(--accent);border-color:rgba(0,212,170,0.3)}

.field-block{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:grab;transition:border-color 0.15s}
.field-block:hover{border-color:var(--accent)}
.field-type-btn{background:var(--bg3);border:1px dashed var(--border2);border-radius:7px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all 0.15s;font-size:10px;color:var(--text3);font-family:var(--font-mono)}
.field-type-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,212,170,0.05)}
.field-types-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}

.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:80px;height:80px;flex-shrink:0}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:5px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:#1e2230;border:1px solid var(--accent);border-radius:9px;padding:12px 18px;font-size:13px;color:var(--text);z-index:9999;font-family:var(--font-body);display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,0.4);animation:slideUp 0.25s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-view{animation:fadeIn 0.2s ease}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-mark"><i class="ti ti-shield-check"></i></div>
    <div class="sb-logo-text">Safe<span>Ops</span></div>
  </div>
  <div class="sb-nav">
    <div class="sb-section">Main</div>
    <div class="nav-item active" data-page="dashboard"><i class="ti ti-layout-dashboard"></i>Dashboard</div>
    <div class="nav-item" data-page="inspections"><i class="ti ti-clipboard-check"></i>Inspections<span class="nav-badge blue">12</span></div>
    <div class="nav-item" data-page="tasks"><i class="ti ti-checklist"></i>Tasks<span class="nav-badge warn">5</span></div>
    <div class="nav-item" data-page="incidents"><i class="ti ti-alert-triangle"></i>Incidents<span class="nav-badge">3</span></div>
    <div class="nav-item" data-page="assets"><i class="ti ti-tools"></i>Assets</div>
    <div class="sb-section">Configure</div>
    <div class="nav-item" data-page="templates"><i class="ti ti-template"></i>Templates</div>
    <div class="nav-item" data-page="reports"><i class="ti ti-chart-bar"></i>Reports</div>
    <div class="nav-item" data-page="users"><i class="ti ti-users"></i>Users & Roles</div>
    <div class="nav-item" data-page="settings"><i class="ti ti-settings"></i>Settings</div>
  </div>
  <div class="sb-bottom">
    <div class="sb-user">
      <div class="avatar">RK</div>
      <div class="user-info">
        <div class="user-name">Rahul Kapoor</div>
        <div class="user-role">Super Admin</div>
      </div>
      <i class="ti ti-chevron-right" style="color:var(--text3);font-size:13px"></i>
    </div>
  </div>
</div>

<div id="main">
  <div class="topbar">
    <div class="page-title" id="page-title">Dashboard</div>
    <div class="topbar-search"><i class="ti ti-search"></i><input placeholder="Search anything…"></div>
    <div class="topbar-actions">
      <div class="icon-btn notif"><i class="ti ti-bell" style="font-size:16px"></i><span class="notif-dot"></span></div>
      <div class="icon-btn"><i class="ti ti-help-circle" style="font-size:16px"></i></div>
      <button class="btn btn-primary" id="primary-btn"><i class="ti ti-plus" style="font-size:14px"></i><span id="primary-btn-label">New Inspection</span></button>
    </div>
  </div>
  <div class="page-content" id="page-content"></div>
</div>

<script>
let currentPage = 'dashboard';
const pages = {
  dashboard:{title:'Dashboard',btn:'New Inspection'},
  inspections:{title:'Inspections',btn:'Schedule Inspection'},
  tasks:{title:'Task Management',btn:'Create Task'},
  incidents:{title:'Incident Management',btn:'Report Incident'},
  assets:{title:'Asset Registry',btn:'Add Asset'},
  templates:{title:'Inspection Templates',btn:'New Template'},
  reports:{title:'Reports & Analytics',btn:'Export Report'},
  users:{title:'Users & Roles',btn:'Add User'},
  settings:{title:'Settings',btn:'Save Changes'},
};

document.querySelectorAll('.nav-item[data-page]').forEach(el=>{
  el.addEventListener('click',()=>navigate(el.dataset.page));
});
document.getElementById('primary-btn').addEventListener('click',()=>showToast(pages[currentPage].btn+' — panel opened.'));

function navigate(page){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector('.nav-item[data-page="'+page+'"]').classList.add('active');
  document.getElementById('page-title').textContent=pages[page].title;
  document.getElementById('primary-btn-label').textContent=pages[page].btn;
  const c=document.getElementById('page-content');
  c.innerHTML='<div class="page-view">'+renderPage(page)+'</div>';
  c.scrollTop=0;
  c.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',function(){this.closest('.tabs').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));this.classList.add('active')}));
  c.querySelectorAll('.toggle').forEach(t=>t.addEventListener('click',function(){this.classList.toggle('on')}));
  c.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',function(){this.closest('div').querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')}));
}

function showToast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML='<i class="ti ti-circle-check" style="color:var(--accent);font-size:16px"></i>'+msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}

function renderPage(p){
  const r={dashboard,inspections,tasks,incidents,assets,templates,reports,users,settings};
  return r[p]?r[p]():'<p style="color:var(--text2)">Coming soon.</p>';
}

/* ── HELPERS ── */
function kpi(label,value,sub,color,icon){
  const up=sub.includes('↑'),dn=sub.includes('↓');
  return`<div class="kpi"><div class="kpi-accent" style="background:${color}"></div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub ${up?'kpi-up':dn?'kpi-down':''}">${sub}</div><i class="ti ${icon} kpi-icon"></i></div>`;
}
function barChart(data,labels,color){
  const mx=Math.max(...data);
  return`<div class="bar-chart">${data.map((v,i)=>`<div class="bar-col"><div class="bar" style="height:${(v/mx)*100}%;background:${color};opacity:${0.45+0.55*(v/mx)}"></div><div class="bar-label">${labels[i]}</div></div>`).join('')}</div>`;
}
function priBar(label,count,pct,color){
  return`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:11px;color:var(--text2)">${label}</span><span style="font-size:11px;font-family:var(--font-mono);color:var(--text3)">${count}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div></div>`;
}
function actRow(icon,bg,title,meta,badge,bval){
  return`<div class="activity-item"><div class="activity-icon" style="background:${bg}"><i class="ti ${icon}" style="font-size:15px;color:var(--danger)"></i></div><div class="act-info"><div class="act-title">${title}</div><div class="act-meta">${meta}</div></div><span class="badge ${badge}">${bval}</span></div>`;
}
function actInsp(title,user,badge,bval){
  return`<div class="activity-item"><div class="activity-icon" style="background:rgba(0,153,255,0.1)"><i class="ti ti-clipboard-check" style="font-size:15px;color:var(--accent2)"></i></div><div class="act-info"><div class="act-title">${title}</div><div class="act-meta">${user}</div></div><span class="badge ${badge}">${bval}</span></div>`;
}

/* ── DASHBOARD ── */
function dashboard(){
  return`
  <div class="kpi-grid">
    ${kpi('Total Employees','248','↑ 12 this month','var(--accent)','ti-users')}
    ${kpi('Active Locations','34','6 regions covered','var(--accent2)','ti-map-pin')}
    ${kpi('Open Incidents','7','3 high severity','var(--danger)','ti-alert-triangle')}
    ${kpi('Completed Tasks','1,284','94.2% on time','var(--success)','ti-circle-check')}
  </div>
  <div class="kpi-grid">
    ${kpi('Inspections This Month','142','↑ 18% vs last','var(--accent)','ti-clipboard-check')}
    ${kpi('Total Assets','689','23 due for service','var(--warn)','ti-tools')}
    ${kpi('Overdue Tasks','5','Action required','var(--danger)','ti-clock-exclamation')}
    ${kpi('Compliance Score','96.4%','Above target','var(--success)','ti-shield-check')}
  </div>
  <div class="grid-3" style="margin-bottom:12px">
    <div class="card">
      <div class="card-header"><div><div class="card-title">Inspection Trends</div><div class="card-subtitle">LAST 7 DAYS</div></div></div>
      ${barChart([42,58,35,71,64,88,72],['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],'var(--accent)')}
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Asset Status</div></div>
      <div class="donut-wrap">
        <svg class="donut" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="30" fill="none" stroke="#22263333" stroke-width="12"/>
          <circle cx="40" cy="40" r="30" fill="none" stroke="#00d4aa" stroke-width="12" stroke-dasharray="113 75" stroke-dashoffset="0" transform="rotate(-90 40 40)"/>
          <circle cx="40" cy="40" r="30" fill="none" stroke="#f5a623" stroke-width="12" stroke-dasharray="28 160" stroke-dashoffset="-113" transform="rotate(-90 40 40)"/>
